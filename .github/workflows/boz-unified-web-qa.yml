name: BOZ Unified Web Build and Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packages/**'
      - 'services/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/boz-unified-web-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_BOZ_POS_CHECKOUT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Unit and security boundary tests
        run: npm run test:contracts && npm run test:catalog && npm run test:commerce && npm run test:pos
      - name: Compile production web bundle
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke QA
        run: npm run test:browser

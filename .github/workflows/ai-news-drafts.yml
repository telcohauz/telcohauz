name: AI.NEWS - two safe draft slots per day

on:
  workflow_dispatch:
    inputs:
      demo:
        description: 'Use offline demo data (no news claims)'
        type: boolean
        required: true
        default: true
  schedule:
    # UTC, Malaysia UTC+8: 12:13 PM and 8:17 PM
    - cron: '13 4 * * *'
    - cron: '17 12 * * *'
  pull_request:
    paths:
      - 'apps/ai-news/**'
      - '.github/workflows/ai-news-drafts.yml'

permissions:
  contents: read

concurrency:
  group: ai-news-drafts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r apps/ai-news/requirements.txt
      - name: Run tests
        working-directory: apps/ai-news
        run: python -m unittest discover -v
      - name: Generate safe drafts only (no publish)
        working-directory: apps/ai-news
        env:
          AI_NEWS_ALLOW_PUBLISH: 'false'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python engine.py --slot auto --out output
          else
            python engine.py --slot auto --out output --demo
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-news-safe-drafts-${{ github.run_id }}
          path: apps/ai-news/output/
          retention-days: 3
          if-no-files-found: warn

name: BOZ POS Android Test APK
on:
  push:
    branches:
      - boz-pos-expo-mvp-20261012
    paths:
      - 'boz-pos-expo/App.tsx'
      - 'boz-pos-expo/index.ts'
      - 'boz-pos-expo/src/**'
      - 'boz-pos-expo/tests/**'
      - 'boz-pos-expo/scripts/**'
      - 'boz-pos-expo/package.json'
      - 'boz-pos-expo/app.json'
      - 'boz-pos-expo/tsconfig.json'
      - 'boz-pos-expo/eas.json'
      - '.github/workflows/boz-pos-expo-apk.yml'
  workflow_dispatch:
concurrency:
  group: boz-pos-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    defaults:
      run:
        working-directory: boz-pos-expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Validate application
        run: npm run check && npm run typecheck
      - name: Test mobile API boundaries
        run: npm run unit
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build installable debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: boz-pos-debug-apk
          path: boz-pos-expo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

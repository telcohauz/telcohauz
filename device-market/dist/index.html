<script>
'use strict';
const $ = id => document.getElementById(id);
const key = 'telcohauz-market-v1';
const states = ['Johor','Kedah','Kelantan','Melaka','Negeri Sembilan','Pahang','Perak','Perlis','Pulau Pinang','Sabah','Sarawak','Selangor','Terengganu','Kuala Lumpur','Putrajaya','Labuan'];
const categories = [['Telefon','Phones'],['Tablet','Tablets'],['Jam pintar','Wearables'],['Komputer riba','Laptops'],['Konsol','Consoles']];
const conditions = [['Baharu','New'],['Terpakai','Used'],['Dibaik pulih','Refurbished'],['Rosak','Damaged']];
const icons = ['▯','▣','◉','▱','✚'];
const featuredModels=['iPhone 13','iPhone 13 mini','iPhone 13 Pro','iPhone 15','Galaxy S23','X9d'];
const plans = [['CelcomDigi','https://www.celcomdigi.com/'],['Maxis','https://www.maxis.com.my/'],['Hotlink','https://www.hotlink.com.my/'],['U Mobile','https://www.u.com.my/'],['Yes','https://www.yes.my/'],['Unifi Mobile','https://unifi.com.my/'],['redONE','https://www.redonemobile.com.my/']];
const services = [['repair','Baiki','Repair'],['setup','Persediaan','Setup'],['lesson','Latihan','Lessons'],['recovery','Pemulihan data','Data recovery'],['custom','Penyesuaian','Customization']];
const pages = {market:['Beli peranti','Buy devices'],sell:['Iklan jualan','List a device'],buyback:['Buyback','Buyback'],broken:['Baiki & peranti rosak','Repair & damaged'],rent:['Sewa','Rent'],trade:['Trade-in & tukar','Trade-in & swap'],wanted:['Iklan pembeli','Wanted ads'],experts:['Juruteknik','Experts'],plans:['Pelan telco','Mobile plans'],alerts:['Amaran harga','Price alerts'],green:['Guna semula','Reuse leaderboard'],activity:['Aktiviti saya','My activity'],partners:['Rakan niaga','Partners'],buyers:['Jadi Buyer Partner','Become a Buyer Partner'],knowledge:['Katalog Telefon','Phone Catalogue'],virtualshop:['Pilihan Telefon','Featured Phones'],benchmark:['Nilai Rujukan RM','RM Price Reference'],offers:['Akaun & Tawaran','Account & Offers']};
const clean = {listings:[],requests:[],alerts:[],partners:[],plans:[],lang:'ms'};
let data;
let pendingQuery='';
let pendingPhoneQuery='';
let detectedState='';
let locationMessage='';
try { data = {...clean,...JSON.parse(localStorage.getItem(key) || '{}')}; } catch { data = structuredClone(clean); }
function save() { try { localStorage.setItem(key,JSON.stringify(data)); return true; } catch { $('status').textContent=t('Storan pelayar penuh. Rekod ini hanya kekal sehingga halaman ditutup.','Browser storage is full. This record lasts until the page closes.'); return false; } }
const t = (ms,en) => data.lang==='ms'?ms:en;
const label = a => t(...a);
const esc = x => String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm = x => 'RM '+Number(x).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const page = () => Object.hasOwn(pages,location.hash.slice(1))?location.hash.slice(1):'market';
const nav = names => names.map(p=>'<button data-page="'+p+'" '+(page()===p?'aria-current="page"':'')+'>'+label(pages[p])+'</button>').join('');
const field = (a,n,type='text',attrs='required') => '<label>'+a+'<input name="'+n+'" type="'+type+'" '+attrs+'></label>';
const select = (a,n,options,placeholder='') => '<label>'+a+'<select name="'+n+'" required>'+ (placeholder?'<option value="">'+placeholder+'</option>':'')+options.map(([v,k])=>'<option value="'+esc(v)+'">'+esc(k)+'</option>').join('')+'</select></label>';
const choices = xs => xs.map((x,i)=>[i,label(x)]);
const stateField = () => select(t('Negeri','State'),'state',states.map(x=>[x,x]));
const kindField = () => select(t('Kategori','Category'),'category',choices(categories));
const conditionField = () => select(t('Keadaan','Condition'),'condition',choices(conditions));
const modelField = () => field(t('Jenama dan model','Brand and model'),'title','text','required maxlength="90"');
const priceField = (a,n='price') => field(a,n,'number','required min="0.01" max="100000" step=".01"');
const notes = (a=t('Butiran','Details')) => '<label>'+a+'<textarea name="description" maxlength="500" required></textarea></label>';
const act = (a,b,variant='')=>'<button class="'+variant+'" data-action="'+a+'">'+b+'</button>';
const today = () => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let sharedListings=[];
const all = () => [...sharedListings,...data.listings];
const id = () => globalThis.crypto?.randomUUID?.() || Date.now().toString(36)+Math.random().toString(36).slice(2);
const ref = () => 'TH-'+id().slice(0,8).toUpperCase();
const localDate = iso => new Date(iso).toLocaleString(data.lang==='ms'?'ms-MY':'en-MY',{timeZone:'Asia/Kuala_Lumpur'});
function openForm(title,html,submit,handler,local=true){
 $('modalTitle').textContent=title;
 $('modalBody').innerHTML='<form>'+html+'<div role="alert" class="error"></div><button class="primary">'+submit+'</button></form>';
 const form=$('modalBody').querySelector('form');
 if(form.elements.state&&detectedState)form.elements.state.value=detectedState;
 form.addEventListener('submit',async event=>{
  event.preventDefault();
  const button=form.querySelector('button');button.disabled=true;
  try{
   if(form.elements.title && !form.elements.title.value.trim()) throw Error(t('Masukkan nama atau model.','Enter a name or model.'));
   const result=await handler(Object.fromEntries(new FormData(form)),form);
   $('modal').close();render();$('status').textContent='';
   if(local){if(save())$('status').textContent=t('Disimpan dalam pelayar ini.','Saved in this browser.');}
   else $('status').textContent=typeof result==='string'&&!/^[-a-f0-9]{36}$/i.test(result)?result:t('Permintaan berjaya diproses.','Request processed.');
  }catch(e){form.querySelector('.error').textContent=e.message;}
  finally{button.disabled=false;}
 });
 if(!$('modal').open)$('modal').showModal();
}
function addRequest(type,values){
 data.requests.unshift({...values,type,id:ref(),created:new Date().toISOString(),status:'pending'});
}
function dateFields(){
 return '<div class="two">'+field(t('Tarikh mula','Start date'),'start','date','required min="'+today()+'"')+field(t('Tarikh tamat','End date'),'end','date','required min="'+today()+'"')+'</div>';
}
function listing(type){
 const listingType=type==='sell'?'market':type;
 const special=listingType==='rent'?field(t('Unit tersedia','Available units'),'quantity','number','required min="1" max="100" step="1"'):'';
 openForm(label(pages[type]),modelField()+kindField()+conditionField()+stateField()+field(t('Bandar','Town'),'city','text','required maxlength="70"')+priceField(listingType==='rent'?t('Kadar sehari (RM)','Daily rate (RM)'):t('Jumlah (RM)','Amount (RM)'))+special+notes()+field(t('Foto pilihan (JPEG/PNG/WebP)','Optional photo (JPEG/PNG/WebP)'),'photo','file','accept="image/jpeg,image/png,image/webp"'),t('Simpan iklan','Save listing'),async v=>{
  let photo='';
  if(v.photo?.size){
   if(v.photo.size>500000 || !['image/jpeg','image/png','image/webp'].includes(v.photo.type)) throw Error(t('Gunakan foto JPG, PNG atau WebP hingga 500 KB.','Use a JPG, PNG or WebP image up to 500 KB.'));
   photo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(v.photo);});
  }
  data.listings.unshift({...v,photo,type:listingType,id:id(),category:Number(v.category),condition:Number(v.condition),price:Number(v.price),quantity:Number(v.quantity||1)});
 });
}
function booking(item){
 const name=label(pages[item.type]||pages.market);
 let html=(item.photo?'<img class="model-photo" alt="'+esc(item.title)+'" src="'+esc(item.photo)+'">':modelPhoto(item.title))+'<p>'+esc(item.title)+' · '+rm(item.price)+'</p>';
 if(item.type==='rent') html+=dateFields()+field(t('Bilangan peranti','Device quantity'),'quantity','number','required min="1" max="'+item.quantity+'" step="1"');
 if(item.type==='wanted') html+=priceField(t('Tawaran anda (RM)','Your offer (RM)'),'offer');
 if(item.type==='trade') html+=modelField();
 openForm(name,html+notes(t('Mesej atau butiran serahan','Message or handover details')),t('Simpan permintaan','Save request'),v=>{
  let details={title:item.title,item:item.id,description:v.description};
  if(item.type==='wanted') details.offer=Number(v.offer);
  if(item.type==='trade') details.offeredDevice=v.title;
  if(item.type==='rent'){
   if(v.start<today()||v.end<v.start)throw Error(t('Semak julat tarikh.','Check the date range.'));
   const qty=Number(v.quantity);
   const days=Math.round((Date.parse(v.end)-Date.parse(v.start))/86400000)+1;
   const overlaps=data.requests.filter(r=>r.item===item.id&&r.start<=v.end&&r.end>=v.start&&r.status!=='cancelled');
   const changes=[[v.start,qty]];
   for(const r of overlaps) {
    changes.push([r.start<v.start?v.start:r.start,r.quantity]);
    if(r.end<v.end) changes.push([new Date(Date.parse(r.end)+86400000).toISOString().slice(0,10),-r.quantity]);
   }
   let occupied=0;
   for(const day of [...new Set(changes.map(x=>x[0]))].sort()){
    occupied+=changes.filter(x=>x[0]===day).reduce((sum,x)=>sum+x[1],0);
    if(occupied>item.quantity)throw Error(t('Unit tidak mencukupi pada tarikh dipilih.','Insufficient units on those dates.'));
   }
   details={...details,start:v.start,end:v.end,quantity:qty,total:Number((Math.round(item.price*100)*days*qty/100).toFixed(2))};
  }
  addRequest(item.type,details);
 });
}
function section(title,action=''){return '<div class="sectionhead"><h2>'+title+'</h2>'+action+'</div>';}
function phoneForListing(model){
 const name=model.trim().replace(/\s*[·–]\s*.*$/,'').replace(/\s+(?:64|128|256|512)\s*GB$/i,'').toLowerCase();
 return phoneCatalog.find(x=>[x.model,x.brand+' '+x.model,x.model+' 5G',x.brand+' '+x.model+' 5G'].some(y=>y.toLowerCase()===name));
}
function modelPhoto(model){
 const match=phoneForListing(model);
 if(!match)return '';
 return '<img class="model-photo" src="'+esc(match.image)+'" loading="lazy" referrerpolicy="no-referrer" alt="'+esc(match.brand+' '+match.model)+'"><a class="sub photo-label" href="'+esc(match.gallery)+'" target="_blank" rel="noopener">'+t('Foto model · GSMArena','Model photo · GSMArena')+'</a>';
}
function cards(items){
 return items.length?items.map(x=>'<article class="card">'+(x.photo?'<img alt="'+esc(x.title)+'" src="'+esc(x.photo)+'">':(modelPhoto(x.title)||'<div class="plate" aria-hidden="true">'+icons[x.category]+'</div>'))+'<span class="pill">'+label(conditions[x.condition])+(x.sample?' · '+t('Contoh','Sample'):'')+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.city)+', '+esc(x.state)+'</p><div class="price">'+(x.price==null?'Ask Price':rm(x.price))+(x.type==='rent'?' '+t('/ hari','/ day'):'')+'</div><p>'+esc(x.description)+'</p>'+(x.seller?'<p class="sub">'+esc(x.seller)+' · '+t('Kedai demo','Demo shop')+'</p>':'')+(x.model_key?act('ask-price:'+x.model_key,x.price==null?'Ask Price':t('Mohon tawaran','Request an offer')):act('item:'+x.id,t('Lihat & buat permintaan','View & request')))+'</article>').join(''):'<p class="empty wide">'+t('Tiada hasil untuk penapis ini.','No results match these filters.')+'</p>';
}
function browse(type){
 const listings=all().filter(x=>x.type===type).sort((a,b)=>Number(b.state===detectedState)-Number(a.state===detectedState));
 const brandName=x=>phoneForListing(x.title)?.brand||['Apple','Samsung','HONOR','Xiaomi','OPPO','vivo','Google','realme','OnePlus','Infinix','TECNO','Motorola','Huawei','Nothing','Nokia'].find(brand=>x.title.toLowerCase().startsWith(brand.toLowerCase()+' '));
 const brands=[...new Set([...phoneCatalog.map(x=>x.brand),...listings.map(brandName).filter(Boolean)])].sort();

 function show(){
  const words=input.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  options=names.filter(name=>words.every(word=>name.toLowerCase().includes(word))).slice(0,6);
  selected=-1;
  list.innerHTML=options.map((name,i)=>'<li id="suggestion-'+i+'" data-option="'+i+'" role="option" aria-selected="false">'+esc(name)+'</li>').join('');
  if(!options.length){close();return;}
  list.hidden=false;input.setAttribute('aria-expanded','true');input.removeAttribute('aria-activedescendant');
 }
 function search(value){
  const query=value.trim();
  if(!query)return;
  if(all().some(x=>x.type==='market'&&x.title.toLowerCase().includes(query.toLowerCase()))){pendingQuery=query;route('market');}
  else{pendingPhoneQuery=query;route('knowledge');}
 }
 input.addEventListener('focus',show);
 input.addEventListener('click',()=>{if(list.hidden)show();});
 input.addEventListener('input',show);
 input.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&!list.hidden){event.preventDefault();close();return;}
  if(!['ArrowDown','ArrowUp'].includes(event.key))return;
  if(list.hidden)show();
  if(!options.length)return;
  event.preventDefault();
  const advance=event.key==='ArrowDown'?1:-1;
  selected=selected<0?(advance>0?0:options.length-1):(selected+advance+options.length)%options.length;
  [...list.children].forEach((option,i)=>option.setAttribute('aria-selected',String(i===selected)));
  input.setAttribute('aria-activedescendant','suggestion-'+selected);
 });
 list.addEventListener('pointerdown',event=>event.preventDefault());
 list.addEventListener('click',event=>{const option=event.target.closest('[data-option]');if(option)search(options[Number(option.dataset.option)]);});
 form.addEventListener('focusout',event=>{if(!form.contains(event.relatedTarget))close();});
 form.onsubmit=event=>{event.preventDefault();search(!list.hidden&&selected>=0?options[selected]:input.value);};
}
function renderLocation(){
 const panel=$('geoText');
 if(!panel)return;
 if(detectedState){panel.textContent=t('Lokasi dikesan: ','Location detected: ')+detectedState;return;}
 panel.innerHTML=esc(locationMessage||t('Malaysia','Malaysia'))+
  (navigator.geolocation?' '+act('detect-location',t('Guna lokasi saya','Use my location')):'');
}
function isInsideRing(point,ring){
 const [x,y]=point;
 let inside=false;
 for(let i=0,j=ring.length-1;i<ring.length;j=i++){
  const [xi,yi]=ring[i],[xj,yj]=ring[j];
  if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)inside=!inside;
 }
 return inside;
}
async function detectLocation(){
 if(!navigator.geolocation)return;
 locationMessage=t('Mengesan lokasi…','Detecting location…');renderLocation();
 try{
  const {coords}=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{timeout:7500,maximumAge:300000}));
  const response=await fetch('assets/malaysia-states.geojson');
  if(!response.ok)throw Error('Boundary data unavailable');
  const map=await response.json();
  const point=[coords.longitude,coords.latitude];
  const feature=map.features.find(({geometry})=>{
   const polygons=geometry.type==='Polygon'?[geometry.coordinates]:geometry.coordinates;
   return polygons.some(rings=>isInsideRing(point,rings[0])&&!rings.slice(1).some(ring=>isInsideRing(point,ring)));
  });
  const state=feature?.properties.shapeName;
  detectedState=({Penang:'Pulau Pinang',Malacca:'Melaka'})[state]||state||'';
  locationMessage=t('Lokasi negeri tidak dapat dikesan.','State location could not be detected.');
 }catch{locationMessage=t('Lokasi tidak dapat dikesan.','Location could not be detected.');}
 if(detectedState){
  const filter=$('expertState');
  if(filter){filter.value=detectedState;filter.dispatchEvent(new Event('change'));}
  if(['market','rent','trade','broken','wanted'].includes(page())){
   const old=Object.fromEntries(['query','category','browseBrand','budget'].map(id=>[id,$(id).value]));
   browse(page());
   for(const [id,value] of Object.entries(old))$(id).value=value;
   $('query').dispatchEvent(new Event('input'));
  }
 }
 renderLocation();
}

}

});

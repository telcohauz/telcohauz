<script>
'use strict';
const $ = id => document.getElementById(id);
const key = 'telcohauz-market-v1';
const states = ['Johor','Kedah','Kelantan','Melaka','Negeri Sembilan','Pahang','Perak','Perlis','Pulau Pinang','Sabah','Sarawak','Selangor','Terengganu','Kuala Lumpur','Putrajaya','Labuan'];
const categories = [['Telefon','Phones'],['Tablet','Tablets'],['Jam pintar','Wearables'],['Komputer riba','Laptops'],['Konsol','Consoles']];
const conditions = [['Baharu','New'],['Terpakai','Used'],['Dibaik pulih','Refurbished'],['Rosak','Damaged']];
const icons = ['▯','▣','◉','▱','✚'];
const virtualShop = {name:'Litar Mobile AI',city:'Johor Bahru',state:'Johor',
 models:['iPhone 13','iPhone 13 mini','iPhone 13 Pro','iPhone 15','Galaxy S23','X9d']};
const plans = [['CelcomDigi','https://www.celcomdigi.com/'],['Maxis','https://www.maxis.com.my/'],['Hotlink','https://www.hotlink.com.my/'],['U Mobile','https://www.u.com.my/'],['Yes','https://www.yes.my/'],['Unifi Mobile','https://unifi.com.my/'],['redONE','https://www.redonemobile.com.my/']];
const services = [['repair','Baiki','Repair'],['setup','Persediaan','Setup'],['lesson','Latihan','Lessons'],['recovery','Pemulihan data','Data recovery'],['custom','Penyesuaian','Customization']];
const pages = {market:['Beli peranti','Buy devices'],sell:['Iklan jualan','List a device'],buyback:['Buyback','Buyback'],broken:['Baiki & peranti rosak','Repair & damaged'],rent:['Sewa','Rent'],trade:['Trade-in & tukar','Trade-in & swap'],wanted:['Iklan pembeli','Wanted ads'],experts:['Juruteknik','Experts'],plans:['Pelan telco','Mobile plans'],alerts:['Amaran harga','Price alerts'],green:['Guna semula','Reuse leaderboard'],activity:['Aktiviti saya','My activity'],partners:['Rakan niaga','Partners'],buyers:['Jadi Buyer Partner','Become a Buyer Partner'],knowledge:['Katalog Telefon','Phone Catalogue'],virtualshop:['Litar Mobile AI','Litar Mobile AI'],benchmark:['Nilai Rujukan RM','RM Price Reference']};
const clean = {listings:[],requests:[],alerts:[],partners:[],plans:[],lang:'ms'};
let data;
let pendingQuery='';
try { data = {...clean,...JSON.parse(localStorage.getItem(key) || '{}')}; } catch { data = structuredClone(clean); }
function save() { try { localStorage.setItem(key,JSON.stringify(data)); return true; } catch { $('status').textContent=t('Storan pelayar penuh. Rekod ini hanya kekal sehingga halaman ditutup.','Browser storage is full. This record lasts until the page closes.'); return false; } }
const t = (ms,en) => data.lang==='ms'?ms:en;
const label = a => t(...a);
const esc = x => String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm = x => 'RM '+Number(x).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const page = () => Object.hasOwn(pages,location.hash.slice(1))?location.hash.slice(1):'market';
const nav = names => names.map(p=>'<button data-page="'+p+'" '+(page()===p?'aria-current="page"':'')+'>'+label(pages[p])+'</button>').join('');
const field = (a,n,type='text',attrs='required') => '<label>'+a+'<input name="'+n+'" type="'+type+'" '+attrs+'></label>';
const select = (a,n,options,placeholder='') => '<label>'+a+'<select name="'+n+'" required>'+ (placeholder?'<option value="">'+placeholder+'</option>':'')+options.map(([v,k])=>'<option value="'+esc(v)+'">'+esc(k)+'</option>').join('')+'</select></label>';
const choices = xs => xs.map((x,i)=>[i,label(x)]);
const stateField = () => select(t('Negeri','State'),'state',states.map(x=>[x,x]));
const kindField = () => select(t('Kategori','Category'),'category',choices(categories));
const conditionField = () => select(t('Keadaan','Condition'),'condition',choices(conditions));
const modelField = () => field(t('Jenama dan model','Brand and model'),'title','text','required maxlength="90"');
const priceField = (a,n='price') => field(a,n,'number','required min="0.01" max="100000" step=".01"');
const notes = (a=t('Butiran','Details')) => '<label>'+a+'<textarea name="description" maxlength="500" required></textarea></label>';
const act = (a,b,variant='')=>'<button class="'+variant+'" data-action="'+a+'">'+b+'</button>';
const today = () => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const all = () => data.listings;
const id = () => globalThis.crypto?.randomUUID?.() || Date.now().toString(36)+Math.random().toString(36).slice(2);
const ref = () => 'TH-'+id().slice(0,8).toUpperCase();
const localDate = iso => new Date(iso).toLocaleString(data.lang==='ms'?'ms-MY':'en-MY',{timeZone:'Asia/Kuala_Lumpur'});
function openForm(title,html,submit,handler){
 $('modalTitle').textContent=title;
 $('modalBody').innerHTML='<form>'+html+'<div role="alert" class="error"></div><button class="primary">'+submit+'</button></form>';
 const form=$('modalBody').querySelector('form');
 if(form.elements.state&&states.includes(data.marketState))form.elements.state.value=data.marketState;
 form.addEventListener('submit',async event=>{
  event.preventDefault();
  const button=form.querySelector('button');button.disabled=true;
  try{
   if(form.elements.title && !form.elements.title.value.trim()) throw Error(t('Masukkan nama atau model.','Enter a name or model.'));
   await handler(Object.fromEntries(new FormData(form)),form);
   $('modal').close();render();$('status').textContent='';
   if(save()) $('status').textContent=t('Disimpan dalam pelayar ini.','Saved in this browser.');
  }catch(e){form.querySelector('.error').textContent=e.message;}
  finally{button.disabled=false;}
 });
 if(!$('modal').open)$('modal').showModal();
}
function addRequest(type,values){
 data.requests.unshift({...values,type,id:ref(),created:new Date().toISOString(),status:'pending'});
}
function dateFields(){
 return '<div class="two">'+field(t('Tarikh mula','Start date'),'start','date','required min="'+today()+'"')+field(t('Tarikh tamat','End date'),'end','date','required min="'+today()+'"')+'</div>';
}
function listing(type){
 const listingType=type==='sell'?'market':type;
 const special=listingType==='rent'?field(t('Unit tersedia','Available units'),'quantity','number','required min="1" max="100" step="1"'):'';
 openForm(label(pages[type]),modelField()+kindField()+conditionField()+stateField()+field(t('Bandar','Town'),'city','text','required maxlength="70"')+priceField(listingType==='rent'?t('Kadar sehari (RM)','Daily rate (RM)'):t('Jumlah (RM)','Amount (RM)'))+special+notes()+field(t('Foto pilihan (JPEG/PNG/WebP)','Optional photo (JPEG/PNG/WebP)'),'photo','file','accept="image/jpeg,image/png,image/webp"'),t('Simpan iklan','Save listing'),async v=>{
  let photo='';
  if(v.photo?.size){
   if(v.photo.size>500000 || !['image/jpeg','image/png','image/webp'].includes(v.photo.type)) throw Error(t('Gunakan foto JPG, PNG atau WebP hingga 500 KB.','Use a JPG, PNG or WebP image up to 500 KB.'));
   photo=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(v.photo);});
  }
  data.listings.unshift({...v,photo,type:listingType,id:id(),category:Number(v.category),condition:Number(v.condition),price:Number(v.price),quantity:Number(v.quantity||1)});
 });
}
function booking(item){
 const name=label(pages[item.type]||pages.market);
 let html=(item.photo?'<img class="model-photo" alt="'+esc(item.title)+'" src="'+esc(item.photo)+'">':modelPhoto(item.title))+'<p>'+esc(item.title)+' · '+rm(item.price)+'</p>';
 if(item.type==='rent') html+=dateFields()+field(t('Bilangan peranti','Device quantity'),'quantity','number','required min="1" max="'+item.quantity+'" step="1"');
 if(item.type==='wanted') html+=priceField(t('Tawaran anda (RM)','Your offer (RM)'),'offer');
 if(item.type==='trade') html+=modelField();
 openForm(name,html+notes(t('Mesej atau butiran serahan','Message or handover details')),t('Simpan permintaan','Save request'),v=>{
  let details={title:item.title,item:item.id,description:v.description};
  if(item.type==='wanted') details.offer=Number(v.offer);
  if(item.type==='trade') details.offeredDevice=v.title;
  if(item.type==='rent'){
   if(v.start<today()||v.end<v.start)throw Error(t('Semak julat tarikh.','Check the date range.'));
   const qty=Number(v.quantity);
   const days=Math.round((Date.parse(v.end)-Date.parse(v.start))/86400000)+1;
   const overlaps=data.requests.filter(r=>r.item===item.id&&r.start<=v.end&&r.end>=v.start&&r.status!=='cancelled');
   const changes=[[v.start,qty]];
   for(const r of overlaps) {
    changes.push([r.start<v.start?v.start:r.start,r.quantity]);
    if(r.end<v.end) changes.push([new Date(Date.parse(r.end)+86400000).toISOString().slice(0,10),-r.quantity]);
   }
   let occupied=0;
   for(const day of [...new Set(changes.map(x=>x[0]))].sort()){
    occupied+=changes.filter(x=>x[0]===day).reduce((sum,x)=>sum+x[1],0);
    if(occupied>item.quantity)throw Error(t('Unit tidak mencukupi pada tarikh dipilih.','Insufficient units on those dates.'));
   }
   details={...details,start:v.start,end:v.end,quantity:qty,total:Number((Math.round(item.price*100)*days*qty/100).toFixed(2))};
  }
  addRequest(item.type,details);
 });
}
function section(title,action=''){return '<div class="sectionhead"><h2>'+title+'</h2>'+action+'</div>';}
function modelPhoto(model){
 const name=model.trim().replace(/\s*[·–]\s*.*$/,'').replace(/\s+(?:64|128|256|512)\s*GB$/i,'').toLowerCase();
 const match=phoneCatalog.find(x=>[x.model,x.brand+' '+x.model,x.model+' 5G',x.brand+' '+x.model+' 5G'].some(y=>y.toLowerCase()===name));
 if(!match)return '';
 return '<img class="model-photo" src="'+esc(match.image)+'" loading="lazy" referrerpolicy="no-referrer" alt="'+esc(match.brand+' '+match.model)+'"><a class="sub photo-label" href="'+esc(match.gallery)+'" target="_blank" rel="noopener">'+t('Foto model · GSMArena','Model photo · GSMArena')+'</a>';
}
function cards(items){
 return items.length?items.map(x=>'<article class="card">'+(x.photo?'<img alt="'+esc(x.title)+'" src="'+esc(x.photo)+'">':(modelPhoto(x.title)||'<div class="plate" aria-hidden="true">'+icons[x.category]+'</div>'))+'<span class="pill">'+label(conditions[x.condition])+(x.sample?' · '+t('Contoh','Sample'):'')+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.city)+', '+esc(x.state)+'</p><div class="price">'+rm(x.price)+(x.type==='rent'?' '+t('/ hari','/ day'):'')+'</div><p>'+esc(x.description)+'</p>'+(x.seller?'<p class="sub">'+esc(x.seller)+' · '+t('Kedai demo','Demo shop')+'</p>':'')+act('item:'+x.id,t('Lihat & buat permintaan','View & request'))+'</article>').join(''):'<p class="empty wide">'+t('Tiada hasil untuk penapis ini.','No results match these filters.')+'</p>';
}
function browse(type){
 const listings=all().filter(x=>x.type===type);
 const action = type==='broken'?act('repair',t('Minta pembaikan','Request repair'),'primary')+' '+act('listing:broken',t('Iklan peranti rosak','List damaged device')):act('listing:'+(type==='market'?'sell':type),({market:t('Iklankan peranti','List a device'),rent:t('Iklankan sewaan','List a rental'),trade:t('Iklankan pertukaran','List a swap'),wanted:t('Iklankan carian','Post wanted ad')})[type],'primary');
 $('view').innerHTML=section(label(pages[type]),'<div>'+action+(type==='trade'?' '+act('tradein','Trade-in'):'')+'</div>')+'<div class="filters"><input id="query" aria-label="'+t('Model atau bandar','Model or town')+'" type="search" placeholder="'+t('Cari model atau bandar','Search model or town')+'"><select id="category" aria-label="'+t('Kategori','Category')+'"><option value="">'+t('Semua kategori','All categories')+'</option>'+choices(categories).map(([i,v])=>'<option value="'+i+'">'+v+'</option>').join('')+'</select><select id="area" aria-label="'+t('Negeri','State')+'"><option value="">'+t('Semua negeri','All states')+'</option>'+states.map(x=>'<option>'+x+'</option>').join('')+'</select><input id="budget" type="number" min="0" aria-label="'+t('Bajet maksimum RM','Maximum budget RM')+'" placeholder="'+t('Bajet RM','Budget RM')+'"></div><div id="cards" class="grid"></div>';
 function filter(){
  const q=$('query').value.trim().toLowerCase(), cat=$('category').value, state=$('area').value,b=$('budget').value;
  $('cards').innerHTML=cards(listings.filter(x=>(x.title+' '+x.city).toLowerCase().includes(q)&&(!cat||x.category===Number(cat))&&(!state||state===x.state)&&(!b||x.price<=Number(b))));
 }
 $('area').value=states.includes(data.marketState)?data.marketState:'';
 if(type==='market'&&pendingQuery){$('query').value=pendingQuery;pendingQuery='';}
 $('view').querySelectorAll('input,select').forEach(el=>el.addEventListener('input',filter));filter();
}
function buyback(){
 $('view').innerHTML=section('Buyback',act('show:benchmark',t('Nilai rujukan MobileMart','MobileMart price reference'))+' '+act('quote-custom',t('Sediakan permintaan sebut harga','Prepare a quote request'),'primary'))+
  '<p>'+t('Semak penanda aras MobileMart atau sediakan permintaan buyback untuk model anda. Permintaan disimpan dalam pelayar sementara sambungan pembeli disediakan.','Check the MobileMart benchmark or prepare a buyback request for your model. Requests are saved in your browser while buyer integration is pending.')+'</p>';
}
function extras(p){
 const target=$('view');
 if(p==='benchmark'){
  target.innerHTML=section(label(pages.benchmark))+'<p>'+t('Tawaran buyback tertinggi yang dipaparkan MobileMart Singapura pada 18 Nov 2026. Harga akhir bergantung pada varian, keadaan dan pemeriksaan.','Highest buyback figures displayed by MobileMart Singapore on 18 Nov 2026. Final offers depend on variant, condition and inspection.')+'</p>'+
   '<p class="notice">SGD 1 = RM '+mobileMartFx.rate+' · <a href="'+mobileMartFx.source+'" target="_blank" rel="noopener">Bank Negara Malaysia</a> · '+mobileMartFx.date+' '+mobileMartFx.session+' · '+t('Kadar pertengahan','Middle rate')+'</p>'+
   '<div class="grid">'+mobileMartBuyback.map(x=>'<article class="card"><h3>'+esc(x.model)+'</h3><div class="price">'+rm(x.sgd*mobileMartFx.rate)+'</div><p>SGD '+x.sgd.toLocaleString('en-SG')+' · '+t('Buyback Singapura','Singapore buyback')+'</p><a href="'+x.source+'" target="_blank" rel="noopener">MobileMart ↗</a></article>').join('')+'</div>'+
   '<p class="sub">'+t('Tukaran mata wang ini ialah penanda aras Singapura. Tawaran kedai Malaysia dan kadar tukaran selepas tarikh semakan boleh berbeza.','This conversion is a Singapore benchmark. Malaysian shop offers and exchange rates after the check date may differ.')+'</p>';
  return;
 }
 if(p==='virtualshop'){
  const items=virtualShop.models.map(model=>phoneCatalog.find(x=>x.model===model));
  target.innerHTML=section(virtualShop.name,'<span class="pill">'+t('Kedai maya','Virtual shop')+'</span>')+
   '<p>'+virtualShop.city+', '+virtualShop.state+' · '+t('Katalog model telefon. Stok dan harga kedai belum disahkan.','Phone model catalogue. Shop stock and prices are pending verification.')+'</p>'+
   '<div class="grid">'+items.map(x=>'<article class="card">'+modelPhoto(x.model)+'<span class="pill">'+esc(virtualShop.name)+'</span><h3>'+esc(x.brand+' '+x.model)+'</h3><p>'+esc(x.storage)+' · '+esc(x.network)+'</p><a href="'+esc(x.source)+'" target="_blank" rel="noopener">'+t('Lihat spesifikasi','View specifications')+' ↗</a></article>').join('')+'</div>';
  return;
 }
 if(p==='knowledge'){
  const brands=[...new Set(phoneCatalog.map(x=>x.brand))];
  target.innerHTML=section(label(pages.knowledge),'<a href="https://www.gsmarena.com/search.php3" target="_blank" rel="noopener">'+t('Cari semua model di GSMArena ↗','Find all models on GSMArena ↗')+'</a>')+
   '<p>'+t('Katalog rujukan awal. Pilihan storan dan kod model boleh berbeza mengikut pasaran.','Starter reference catalogue. Storage and model codes may vary by market.')+'</p>'+
   '<div class="filters"><input id="phoneQuery" type="search" aria-label="'+t('Cari model atau kod','Search model or code')+'" placeholder="'+t('Cari model, cip atau kod','Search model, chip or code')+'"><select id="phoneBrand" aria-label="'+t('Jenama','Brand')+'"><option value="">'+t('Semua jenama','All brands')+'</option>'+brands.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></div><p id="phoneCount" role="status" class="sub"></p><div id="phoneCards" class="grid"></div>';
  const redraw=()=>{
   const q=$('phoneQuery').value.trim().toLowerCase();
   const brand=$('phoneBrand').value;
   const matches=phoneCatalog.filter(x=>(!brand||x.brand===brand)&&[x.brand,x.model,x.chip,x.modelCode,x.network].join(' ').toLowerCase().includes(q));
   $('phoneCount').textContent=matches.length+' / '+phoneCatalog.length+' '+t('model','models');
   $('phoneCards').innerHTML=matches.map(x=>'<article class="card">'+modelPhoto(x.model)+'<span class="pill">'+esc(x.brand)+' · '+x.year+'</span><h3>'+esc(x.model)+'</h3><p>'+esc(x.screen)+' · '+esc(x.chip)+' · '+esc(x.network)+'</p><p>'+t('Storan','Storage')+' '+esc(x.storage)+'<br>'+t('Bateri','Battery')+' '+x.battery+' mAh'+(x.modelCode?'<br>'+t('Kod rujukan','Reference code')+' '+esc(x.modelCode):'')+'</p><a href="'+esc(x.source)+'" target="_blank" rel="noopener">GSMArena ↗</a></article>').join('')||
    '<p class="empty wide">'+t('Model belum ada dalam katalog ini. Gunakan carian GSMArena di atas.','This model is missing from the local catalogue. Use the GSMArena finder above.')+'</p>';
  };
  $('phoneQuery').oninput=redraw;$('phoneBrand').onchange=redraw;redraw();return;
 }
 if(p==='buyers'){
  target.innerHTML=section(label(pages.buyers),act('buyer-profile',t('Sediakan profil minat','Prepare an interest profile'),'primary'))+
   '<p>'+t('Untuk kedai telefon, pemborong dan pengendali buyback yang mahu menerima permintaan jual peranti daripada pelanggan di Malaysia.','For phone shops, wholesalers and buyback operators interested in device-sale requests from customers in Malaysia.')+'</p>'+
   '<div class="grid">'+[
    [t('Pilih peranti','Choose the devices'),t('Nyatakan jenama, keadaan peranti, kawasan dan kuantiti yang kedai terima.','Specify the brands, conditions, service areas and quantities your shop accepts.')],
    [t('Buat tawaran','Make an offer'),t('Aliran pilot dirancang untuk membolehkan kedai memberi anggaran dan harga akhir selepas pemeriksaan.','The planned pilot lets shops give an estimate and confirm the final price after inspection.')],
    [t('Atur serahan','Arrange handover'),t('Bincang cara serahan dan kaedah bayaran sebelum menyertai pilot.','Discuss handover and payout methods before joining the pilot.')]
   ].map(([h,d])=>'<article class="card"><h3>'+h+'</h3><p>'+d+'</p></article>').join('')+'</div>'+
   '<p class="notice">'+t('Borang menyediakan profil untuk disalin dan dibalas melalui emel jemputan. Profil ini tidak dihantar secara automatik.','The form prepares a profile to copy into a reply to the invitation email. It is not submitted automatically.')+'</p>'+
   (data.buyerProfile?'<pre class="partner-profile" id="buyerProfileText">'+esc(data.buyerProfile)+'</pre>'+act('copy-buyer',t('Salin profil','Copy profile')):'');
  return;
 }
 if(p==='plans'){
  target.innerHTML=section(label(pages[p]),act('plan',t('Tambah pelan untuk dibanding','Add plan to compare'),'primary'))+'<p>'+t('Semak harga dan terma di laman rasmi. Simpan pelan pilihan anda untuk perbandingan.','Check official prices and terms. Save selected plans to compare them.')+'</p><div class="filters">'+plans.map(([name,url])=>'<a class="card" href="'+url+'" target="_blank" rel="noopener">'+name+' ↗</a>').join('')+'</div><div class="filters"><input id="planBudget" type="number" min="0" placeholder="'+t('Bajet RM sebulan','Monthly RM budget')+'" aria-label="'+t('Bajet RM sebulan','Monthly RM budget')+'"><select id="planType" aria-label="'+t('Jenis pelan','Plan type')+'"><option value="">'+t('Semua jenis','All types')+'</option><option>Prepaid</option><option>Postpaid</option><option>eSIM</option></select></div><div id="planCards" class="grid"></div>';
  const redraw=()=>{$('planCards').innerHTML=data.plans.filter(x=>(!$('planBudget').value||x.price<=Number($('planBudget').value))&&(!$('planType').value||x.planType===$('planType').value)).sort((a,b)=>a.price-b.price).map(x=>'<article class="card"><h3>'+esc(x.provider)+' · '+esc(x.title)+'</h3><p>'+rm(x.price)+' / '+t('bulan','month')+' · '+esc(x.planType)+' · '+esc(x.gb)+' GB</p><p>'+esc(x.description)+'</p>'+act('remove:plans:'+x.id,t('Buang','Remove'))+'</article>').join('')||'<p>'+t('Tiada pelan untuk penapis ini.','No plans match these filters.')+'</p>';};
  $('planBudget').oninput=redraw;$('planType').onchange=redraw;redraw();return;
 }
 if(p==='experts'||p==='partners'){
  target.innerHTML=section(label(pages[p]),act('partner',t('Daftar profil rakan niaga','Register partner profile'),'primary'))+'<div class="filters"><select id="expertState" aria-label="'+t('Negeri','State')+'"><option value="">'+t('Semua negeri','All states')+'</option>'+states.map(s=>'<option>'+s+'</option>').join('')+'</select><select id="expertService" aria-label="'+t('Perkhidmatan','Service')+'"><option value="">'+t('Semua perkhidmatan','All services')+'</option>'+services.map(([id,ms,en])=>'<option value="'+id+'">'+t(ms,en)+'</option>').join('')+'</select></div><div id="expertCards" class="grid"></div>';
  const providers=data.partners;
  const redraw=()=>{$('expertCards').innerHTML=providers.filter(x=>(!$('expertState').value||x.state===$('expertState').value)&&(!$('expertService').value||x.service===$('expertService').value)).map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3><p>'+esc(x.city)+', '+esc(x.state)+'</p><p>'+esc(x.description)+'</p>'+act('expert:'+x.id,t('Minta servis','Request service'))+'</article>').join('')||'<p>'+t('Tiada padanan.','No matches.')+'</p>';};
  $('expertState').value=states.includes(data.marketState)?data.marketState:'';
  $('expertState').onchange=redraw;$('expertService').onchange=redraw;redraw();return;
 }
 if(p==='alerts'){
  target.innerHTML=section(label(pages[p]),act('alert',t('Tambah amaran','Add alert'),'primary'))+'<p>'+t('Padanan disemak dalam katalog pelayar ini setiap kali halaman dibuka.','Matches are checked against this browser’s catalogue when this page opens.')+'</p><div class="grid">'+data.alerts.map(a=>{
   const matches=all().filter(x=>x.type==='market'&&x.title.toLowerCase().includes(a.title.trim().toLowerCase())&&x.price<=a.price);
   return '<article class="card"><h3>'+esc(a.title)+'</h3><p>≤ '+rm(a.price)+'</p>'+matches.map(x=>'<p>'+esc(x.title)+' · '+rm(x.price)+' '+act('item:'+x.id,t('Lihat','View'))+'</p>').join('')+(matches.length?'':'<p>'+t('Tiada padanan','No matches')+'</p>')+act('remove:alerts:'+a.id,t('Buang','Remove'))+'</article>';
  }).join('')+'</div>';return;
 }
 if(p==='green'){
  const count=data.requests.filter(r=>r.status==='complete'&&['buyback','repair','trade','broken'].includes(r.type)).length;
  target.innerHTML=section(label(pages[p]))+'<p>'+t('Peranti dihantar untuk guna semula atau pembaikan.','Devices handed over for reuse or repair.')+'</p><article class="card"><h3>'+t('Rekod selesai saya','My completed records')+'</h3><div class="price">'+count+'</div></article><p class="sub">'+t('Kedudukan komuniti memerlukan rekod transaksi bersama.','Community ranking requires shared transaction records.')+'</p>';return;
 }
 if(p==='activity'){
  const statuses={pending:t('Menunggu','Pending'),cancelled:t('Dibatalkan','Cancelled'),complete:t('Selesai','Completed')};
  target.innerHTML=section(label(pages[p]))+'<h3>'+t('Permintaan','Requests')+'</h3><div class="grid">'+(data.requests.map(r=>'<article class="card"><span class="pill">'+esc(r.id)+' · '+statuses[r.status]+'</span><h3>'+esc(r.title)+'</h3><p>'+localDate(r.created)+'</p>'+(r.start?'<p>'+esc(r.start)+' → '+esc(r.end)+' · '+r.quantity+' × · '+rm(r.total)+'</p>':'')+(r.offer?'<p>'+rm(r.offer)+'</p>':'')+(r.offeredDevice?'<p>'+esc(r.offeredDevice)+'</p>':'')+(r.when?'<p>'+esc(r.when.replace('T',' '))+' MYT</p>':'')+'<p>'+esc(r.description)+'</p>'+(r.status==='pending'?act('request:cancelled:'+r.id,t('Batal','Cancel'))+' '+act('request:complete:'+r.id,t('Tanda selesai','Mark complete')):'')+'</article>').join('')||'<p>'+t('Tiada permintaan.','No requests yet.')+'</p>')+'</div><h3>'+t('Iklan saya','My listings')+'</h3><div class="grid">'+(data.listings.map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3><p>'+rm(x.price)+'</p>'+act('remove:listings:'+x.id,t('Tarik iklan','Withdraw listing'))+'</article>').join('')||'<p>'+t('Tiada iklan.','No listings yet.')+'</p>')+'</div>';return;
 }
 target.innerHTML=section(label(pages.sell),act('listing:sell',t('Cipta iklan','Create listing'),'primary'))+'<p>'+t('Pilih kategori, nyatakan keadaan peranti dan tambah foto jika ada.','Choose a category, describe the device condition and add a photo if available.')+'</p>';
}
function route(next){
 if(page()===next){render();$('view').scrollIntoView({behavior:'smooth'});}
 else location.hash=next;
}
function render(){
 document.documentElement.lang=data.lang;
 $('language').textContent=t('EN','BM');
 $('notice').textContent=t('Pratonton Malaysia · Rekod transaksi dan iklan baharu disimpan dalam pelayar ini.','Malaysia preview · Transactions and new listings are stored in this browser.');
 $('nav').innerHTML=nav(['market','knowledge','virtualshop','wanted','alerts','activity','buyers']);
 $('footer').innerHTML=nav(['benchmark','experts','partners','plans','green']);
 $('hero').innerHTML='<div><small>DEVICE MARKET · MALAYSIA</small><h1>'+t('Teknologi.<br>Guna semula.','Good tech.<br>Second life.')+'</h1><p>'+t('Cari peranti, banding tawaran buyback atau pilih servis yang anda perlukan.','Find a device, compare buyback offers or choose the service you need.')+'</p>'+'<form id="heroSearch" role="search"><input name="search" type="search" required maxlength="90" aria-label="'+t('Cari model peranti','Search device model')+'" placeholder="'+t('Cari iPhone, Samsung, iPad…','Search iPhone, Samsung, iPad…')+'"><button class="primary">'+t('Cari','Search')+'</button></form><div class="locationBar">'+select(t('Lokasi','Location'),'marketState',states.map(x=>[x,x]),t('Seluruh Malaysia','All Malaysia'))+'</div>'+act('show:buyback',t('Semak nilai peranti','Check device value'),'primary')+'</div><div class="art" aria-hidden="true"><div class="orb"></div><div class="phone back"><i></i><i></i></div><div class="phone front"></div></div>';
 const locationChoice=$('hero').querySelector('[name="marketState"]');
 locationChoice.required=false;
 locationChoice.value=states.includes(data.marketState)?data.marketState:'';
 locationChoice.onchange=()=>{
  data.marketState=locationChoice.value;
  save();
  const filter=$('area')||$('expertState');
  if(filter){filter.value=data.marketState;filter.dispatchEvent(new Event(filter.id==='area'?'input':'change'));}
 };
 $('heroSearch').onsubmit=e=>{
  e.preventDefault();
  pendingQuery=String(new FormData(e.currentTarget).get('search')).trim();
  route('market');
 };
 $('partnerCallout').innerHTML='<div><strong>'+t('Kedai telefon di Malaysia?','Run a phone shop in Malaysia?')+'</strong><p>'+t('Sertai pilot sebagai pembeli peranti terpakai.','Join the pilot as a used-device buyer.')+'</p></div>'+act('show:buyers',label(pages.buyers),'primary');
 $('services').innerHTML=['market','sell','buyback','broken','rent','trade'].map((p,i)=>'<button data-page="'+p+'" '+(page()===p?'aria-current="page"':'')+'><span aria-hidden="true">'+['↗','＋','↙','✚','◷','⇄'][i]+'</span>'+label(pages[p])+'</button>').join('');
 const p=page();
 if(['market','rent','trade','broken','wanted'].includes(p))browse(p);
 else if(p==='buyback')buyback();
 else extras(p);
 if(p==='market'&&!all().some(x=>x.type==='market')) $('view').insertAdjacentHTML('beforeend','<p>'+act('show:virtualshop',t('Lihat katalog Litar Mobile AI','Browse Litar Mobile AI catalogue'))+'</p>');
}
function serviceRequest(type,provider=null){
 const title=provider?t('Minta servis','Request service'):type==='repair'?t('Minta pembaikan','Request repair'):type==='trade'?t('Mohon trade-in','Request trade-in'):t('Minta sebut harga','Request a quote');
 const extra=type==='trade'?field(t('Peranti yang diingini','Desired device'),'target','text','required maxlength="90"'):type==='repair'?select(t('Servis','Service'),'service',services.map(([key,ms,en])=>[key,t(ms,en)])):'';
 openForm(title,modelField()+kindField()+conditionField()+stateField()+extra+notes(),t('Simpan permintaan','Save request'),v=>addRequest(type,{...v,provider}));
}
document.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;
 const p=button.dataset.page;if(p){route(p);return;}
 const [action,a,b]=button.dataset.action?.split(':')||[];
 if(action==='show')route(a);
 if(action==='listing')listing(a);
 if(action==='item'){const item=all().find(x=>x.id===a);if(item)booking(item);}
 if(action==='repair')serviceRequest('repair');
 if(action==='tradein')serviceRequest('trade');
 if(action==='quote-custom')serviceRequest('buyback');
 if(action==='expert')serviceRequest('repair',a);
 if(action==='buyer-profile')openForm(label(pages.buyers),field(t('Nama kedai','Shop name'),'title','text','required maxlength="90"')+stateField()+field(t('Bandar','Town'),'city','text','required maxlength="70"')+select(t('Jenis urus niaga','Transaction type'),'buyerType',[['Buyback','Buyback'],['Trade-in','Trade-in'],['Buyback + Trade-in','Buyback + Trade-in']])+notes(t('Kategori, keadaan, kuantiti dan cara serahan','Categories, condition, quantity and handover')),t('Sediakan profil','Prepare profile'),v=>{
  data.buyerProfile=[v.title,v.city+', '+v.state,v.buyerType,v.description].join('\n');
 });
 if(action==='copy-buyer'){
  navigator.clipboard.writeText(data.buyerProfile).then(()=>$('status').textContent=t('Profil disalin.','Profile copied.')).catch(()=>$('status').textContent=t('Pilih dan salin teks profil.','Select and copy the profile text.'));
 }
 if(action==='partner')openForm(label(pages.partners),field(t('Nama kedai atau profil','Shop or profile name'),'title','text','required maxlength="90"')+stateField()+field(t('Bandar','Town'),'city','text','required maxlength="70"')+select(t('Servis utama','Main service'),'service',services.map(([k,ms,en])=>[k,t(ms,en)]))+notes(),t('Simpan profil','Save profile'),v=>data.partners.unshift({...v,id:id()}));
 if(action==='alert')openForm(label(pages.alerts),modelField()+priceField(t('Harga sasaran (RM)','Target price (RM)')),t('Simpan amaran','Save alert'),v=>data.alerts.unshift({...v,price:Number(v.price),id:id()}));
 if(action==='plan')openForm(label(pages.plans),select(t('Telco','Carrier'),'provider',plans.map(([p])=>[p,p]))+field(t('Nama pelan','Plan name'),'title','text','required maxlength="90"')+select(t('Jenis pelan','Plan type'),'planType',['Prepaid','Postpaid','eSIM'].map(x=>[x,x]))+priceField(t('Harga bulanan (RM)','Monthly cost (RM)'))+field(t('Kuota data (GB)','Data allowance (GB)'),'gb','number','required min="0" max="100000" step="1"')+notes(t('Kontrak, panggilan atau syarat','Contract, calls or terms')),t('Simpan pelan','Save plan'),v=>data.plans.unshift({...v,price:Number(v.price),id:id()}));
 if(action==='remove'&&['plans','alerts','listings'].includes(a)){
  if(!confirm(t('Buang rekod ini?','Remove this record?')))return;
  data[a]=data[a].filter(x=>x.id!==b);save();render();
 }
 if(action==='request'&&['cancelled','complete'].includes(a)){
  const r=data.requests.find(x=>x.id===b);
  if(r?.status==='pending'){r.status=a;save();render();}
 }
});
document.addEventListener('error',event=>{
 if(event.target instanceof HTMLImageElement&&event.target.classList.contains('model-photo'))event.target.hidden=true;
},true);
$('close').onclick=()=>$('modal').close();
$('language').onclick=()=>{data.lang=data.lang==='ms'?'en':'ms';save();render();};
window.addEventListener('hashchange',()=>{render();$('view').scrollIntoView({behavior:'smooth'});});
render();
</script></body></html>
